[package]
name = "forest-escrow"
version = "0.1.0"
edition = "2021"
description = "The Forest escrow: an amount of a token (classic SPL Token or Token-2022) held between two keys, out only when the two sides agree; either side may object once, which stops the timer. Sealed per version."
license = "Apache-2.0"
publish = false
exclude = ["tests-litesvm"]

[lib]
crate-type = ["cdylib", "lib"]
name = "forest_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Features Anchor's macros test for; declared so the build has no warnings. None is turned on.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "associated_token"] }
# SHA-256 of an escrow's terms, its address's seed: the runtime's syscall on chain, `sha2` off it.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

# Arithmetic that overflows panics instead of wrapping, beside the checked math in the source.
[profile.release]
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
