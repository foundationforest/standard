[workspace]

[package]
name = "forest-escrow-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM tests for the Forest escrow program, with the clock moved by hand."

[dependencies]
bincode = "1.3"
litesvm = "0.16.0"
sha2 = "0.10"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-clock = "3.1.1"
solana-compute-budget-interface = "3.0.0"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-program-runtime = "4.2"
solana-rent = "4.3.0"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-transaction-context = "4.2"
spl-discriminator = "0.5"
spl-tlv-account-resolution = "0.11.4"
spl-token-2022-interface = "2"
spl-token-metadata-interface = "0.8"
spl-transfer-hook-interface = "2.1.0"
