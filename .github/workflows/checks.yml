# Every pull request and every push to main: each Node package's type-check and tests that need no
# chain (keys is installed first: records, the registry client and the reputation client read it),
# both programs built as SBPF v3 with their LiteSVM tests, and each circuit (reputation, and the
# registry's person proof) compiled, checked against its devnet setup, and tested. After a merge,
# every package type-checks together. Nightly, and by hand: the registry client on a local
# validator, the registry's property test, and the escrow's fuzzer. A test that skips fails its
# step: the summary must say "# skipped 0".

name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  SOLANA_VERSION: '4.2.2'
  CIRCOM_VERSION: '2.2.3'
  CIRCOM_SHA256: '85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3'

defaults:
  run:
    shell: bash

jobs:
  node:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: keys
            install: keys
          - package: records
            install: keys records
          - package: registry/client
            install: keys registry/client
          - package: escrow/client
            install: escrow/client
          - package: reputation/client
            install: keys registry/client reputation/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: for dir in ${{ matrix.install }}; do (cd "$dir" && npm ci --no-audit --no-fund); done
      - name: Type-check
        working-directory: ${{ matrix.package }}
        run: npm run check
      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  circuits:
    name: ${{ matrix.circuit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        circuit: [reputation/circuit, registry/circuit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: circom, its Linux binary checked by SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/circom" "https://github.com/iden3/circom/releases/download/v$CIRCOM_VERSION/circom-linux-amd64"
          echo "$CIRCOM_SHA256  $RUNNER_TEMP/circom" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/circom"
          echo "CIRCOM=$RUNNER_TEMP/circom" >> "$GITHUB_ENV"
      - name: Install
        run: for dir in keys registry/client reputation/client ${{ matrix.circuit }}; do (cd "$dir" && npm ci --no-audit --no-fund); done
      - name: The devnet setup's files, hash-checked
        working-directory: ${{ matrix.circuit }}
        run: npm run fetch
      - name: Compile, and check it is the circuit the setup was made for
        working-directory: ${{ matrix.circuit }}
        run: npm run compile
      - name: Type-check
        working-directory: ${{ matrix.circuit }}
        run: npm run check
      - name: Test
        working-directory: ${{ matrix.circuit }}
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  types:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: for dir in keys records registry/client registry/circuit escrow/client reputation/client reputation/circuit; do (cd "$dir" && npm ci --no-audit --no-fund); done
      - name: Type-check every package
        run: for dir in keys records registry/client registry/circuit escrow/client reputation/client reputation/circuit; do echo "== $dir"; (cd "$dir" && npm run check); done

  programs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Solana CLI, cached
        id: solana
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Solana CLI, installed
        if: steps.solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL "https://release.anza.xyz/v$SOLANA_VERSION/install")"
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            registry/program
            registry/program/tests-litesvm
            escrow/program
            escrow/program/tests-litesvm
      - name: Build the programs, SBPF v3
        run: |
          (cd registry/program && cargo build-sbf --arch v3)
          (cd escrow/program && cargo build-sbf --arch v3)
          sha256sum registry/program/target/deploy/*.so escrow/program/target/deploy/*.so
          # The ELF header's e_flags is the SBPF version: refuse anything but v3.
          for so in registry/program/target/deploy/*.so escrow/program/target/deploy/*.so; do
            v=$(od -An -t u4 -j 48 -N 4 "$so" | tr -d ' ')
            echo "$so: SBPF v$v"
            [ "$v" = 3 ]
          done
      - name: Registry, LiteSVM
        working-directory: registry/program/tests-litesvm
        run: cargo test
      - name: Escrow, LiteSVM
        working-directory: escrow/program/tests-litesvm
        run: cargo test
      - uses: actions/upload-artifact@v7
        with:
          name: programs
          path: |
            registry/program/target/deploy/*.so
            escrow/program/target/deploy/*.so

  validator:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: programs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Solana CLI, cached
        id: solana
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Solana CLI, installed
        if: steps.solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL "https://release.anza.xyz/v$SOLANA_VERSION/install")"
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: programs
      - name: Install
        run: for dir in keys registry/client; do (cd "$dir" && npm ci --no-audit --no-fund); done
      - name: Registry client
        working-directory: registry/client
        run: |
          npm run test:validator | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: programs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: programs
      - name: Solana CLI, cached
        id: solana
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Solana CLI, installed
        if: steps.solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL "https://release.anza.xyz/v$SOLANA_VERSION/install")"
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            escrow/program
            registry/program/tests-litesvm
            escrow/program/trident-tests
      - name: Registry, property test, 1,000 iterations (on the v3 build)
        working-directory: registry/program/tests-litesvm
        run: FOREST_FUZZ_ITERATIONS=1000 cargo test --release --test invariants -- --nocapture
      - name: Escrow, rebuilt as SBPF v0 for Trident, whose runtime runs no v3 program
        working-directory: escrow/program
        run: |
          cargo build-sbf --arch v0
          [ "$(od -An -t u4 -j 48 -N 4 target/deploy/forest_escrow.so | tr -d ' ')" = 0 ]
      - name: Escrow, fuzzer, 50,000 iterations (exit 99 if an invariant broke)
        working-directory: escrow/program/trident-tests
        run: TRIDENT_WITH_EXIT_CODE=1 FOREST_FUZZ_ITERATIONS=50000 cargo run --release --bin fuzz_escrow
